name: Earthquake ACP to X

on:
  schedule:
    - cron: "*/5 * * * *"

  workflow_dispatch:
    inputs:
      publish:
        description: "Publicar en X (false = solo generar resultados)"
        type: boolean
        required: true
        default: true

permissions:
  contents: write

# Evita que dos ejecuciones publiquen el mismo evento
# o modifiquen simultáneamente la rama de estado.
concurrency:
  group: acp-earthquake-publisher
  cancel-in-progress: false

jobs:
  monitor:
    name: Detectar sismos, generar ACP y publicar
    runs-on: ubuntu-latest
    timeout-minutes: 350

    defaults:
      run:
        shell: bash

    env:
      ACP_STATE: ${{ github.workspace }}/.state
      ACP_OUTPUT: ${{ github.workspace }}/output

      # 0 = procesar todos los eventos pendientes.
      MAX_EVENTS_PER_RUN: "0"

      # Cron: publica.
      # Ejecución manual/API: respeta el parámetro publish.
      PUBLISH_TO_X: ${{ (github.event_name == 'schedule' || inputs.publish == true) && 'true' || 'false' }}

      PYTHONUNBUFFERED: "1"
      MPLBACKEND: Agg

      # Disponibles si el Python utiliza variables de entorno.
      # Si las credenciales están escritas dentro del .py,
      # se utilizan los valores definidos en ese archivo.
      X_API_KEY: ${{ secrets.X_API_KEY }}
      X_API_SECRET: ${{ secrets.X_API_SECRET }}
      X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
      X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}

    steps:
      - name: Descargar código
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Restaurar estado persistente
        id: state
        run: |
          set -euo pipefail

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # Una consulta fallida no debe confundirse con
          # la ausencia de la rama de estado.
          if ! remote_state="$(git ls-remote --heads origin refs/heads/acp-state)"; then
            echo "::error::No se pudo consultar la rama acp-state."
            exit 1
          fi

          if [[ -n "$remote_state" ]]; then
            git fetch --no-tags origin refs/heads/acp-state
            git worktree add --detach "$ACP_STATE" FETCH_HEAD
          else
            git worktree add --detach "$ACP_STATE" HEAD
            git -C "$ACP_STATE" checkout --orphan acp-state
            git -C "$ACP_STATE" rm -rf --ignore-unmatch .

            git -C "$ACP_STATE" commit \
              --allow-empty \
              -m "Initialize ACP persistent state"

            git -C "$ACP_STATE" push origin HEAD:acp-state
          fi

          mkdir -p "$ACP_OUTPUT/cache"

          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Restaurar caché NOAA
        id: noaa_cache
        uses: actions/cache/restore@v4
        with:
          path: output/cache
          key: acp-noaa-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            acp-noaa-v1-

      - name: Instalar dependencias
        run: |
          set -euo pipefail
          python -m pip install -r requirements.txt

      - name: Comprobar sintaxis del script
        run: python -m py_compile acp_monitor.py

      - name: Detectar sismos, analizar y publicar
        run: python -u acp_monitor.py

      # El Python guarda el estado durante el procesamiento.
      # Este paso vuelve a intentar persistir cambios locales
      # si algún guardado o push anterior falló.
      - name: Guardar estado pendiente
        if: ${{ always() && steps.state.outputs.ready == 'true' && env.PUBLISH_TO_X == 'true' }}
        run: |
          set -euo pipefail

          git -C "$ACP_STATE" add --all

          if git -C "$ACP_STATE" diff --cached --quiet; then
            echo "Sin cambios de estado pendientes de commit."
          else
            git -C "$ACP_STATE" commit \
              -m "Persist ACP state after execution"
          fi

          git -C "$ACP_STATE" push origin HEAD:acp-state

      - name: Guardar caché NOAA
        if: ${{ always() && steps.noaa_cache.outcome == 'success' }}
        uses: actions/cache/save@v4
        with:
          path: output/cache
          key: acp-noaa-v1-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Guardar videos y resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ACP-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            output/*.json
            output/*/*.mp4
            output/*/*.png
            output/*/*.csv
            output/*/*.json
            output/*/*.txt
            output/*/*.npz
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 0
